<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | TikTok Squad</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2fe; --pink: #ff0055; --glass: rgba(255, 255, 255, 0.05); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: #fff; padding: 40px 5%; display: flex; justify-content: center; }

        .profile-card {
            width: 100%; max-width: 450px; background: var(--glass);
            padding: 40px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center; backdrop-filter: blur(15px);
        }

        /* Avatar Styling */
        .avatar-wrapper {
            position: relative; display: inline-block; margin-bottom: 30px;
        }
        .profile-img {
            width: 130px; height: 130px; border-radius: 50%;
            object-fit: cover; border: 3px solid var(--primary); background: #111;
        }
        .upload-label {
            position: absolute; bottom: 5px; right: 5px;
            background: var(--pink); color: #fff; width: 35px; height: 35px;
            border-radius: 50%; cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #file-input { display: none; }

        .input-group { text-align: left; margin-bottom: 20px; }
        label { font-size: 12px; color: #aaa; margin-left: 5px; }
        input {
            width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 0, 0, 0.3);
            color: #fff; outline: none;
        }

        .btn-save {
            width: 100%; padding: 15px; background: linear-gradient(45deg, var(--primary), #4facfe);
            border: none; border-radius: 12px; color: #000; font-weight: 600;
            cursor: pointer; margin-top: 20px; transition: 0.3s;
        }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

        .status-msg { font-size: 12px; margin-top: 10px; color: var(--primary); display: none; }
    </style>
</head>
<body>

<div class="profile-card">
    <a href="dashboard.html" style="color: var(--primary); text-decoration: none; font-size: 14px; display: block; text-align: left; margin-bottom: 20px;">← Back</a>
    
    <div class="avatar-wrapper">
        <img src="https://via.placeholder.com/150" id="display-avatar" class="profile-img">
        <label for="file-input" class="upload-label">+</label>
        <input type="file" id="file-input" accept="image/png, image/jpeg, image/jpg" onchange="previewImage(event)">
    </div>

    <p id="upload-status" class="status-msg">Uploading...</p>

    <div class="input-group">
        <label>Username</label>
        <input type="text" id="u-username" placeholder="@username">
    </div>

    <div class="input-group">
        <label>Phone Number</label>
        <input type="tel" id="u-phone" placeholder="07x xxx xxxx">
    </div>

    <button id="save-btn" class="btn-save" onclick="updateProfile()">Save Changes</button>
</div>

<script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://wyvzozpnzchcbkfbzvkc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_nbjpXj0bvxHWMJaeCmPzZg_uPsPd4h1';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let selectedFile = null;

    async function getProfile() {
        const { data: { user } } = await _supabase.auth.getUser();
        if (!user) { window.location.href = "index.html"; return; }
        currentUser = user;

        const { data: profile } = await _supabase.from('profiles').select('*').eq('id', user.id).single();
        if (profile) {
            document.getElementById('u-username').value = profile.username || '';
            document.getElementById('u-phone').value = profile.phone || '';
            if (profile.avatar_url) document.getElementById('display-avatar').src = profile.avatar_url;
        }
    }

    // Image preview selection
    function previewImage(event) {
        selectedFile = event.target.files[0];
        if (selectedFile) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('display-avatar').src = e.target.result;
            }
            reader.readAsDataURL(selectedFile);
        }
    }

    async function updateProfile() {
        const saveBtn = document.getElementById('save-btn');
        const status = document.getElementById('upload-status');
        saveBtn.disabled = true;
        status.style.display = 'block';

        let avatarUrl = document.getElementById('display-avatar').src;

        try {
            // 1. Image eka upload kirima (Aluth file ekak select karala nam)
            if (selectedFile) {
                const fileExt = selectedFile.name.split('.').pop();
                const fileName = `${currentUser.id}-${Math.random()}.${fileExt}`;
                const filePath = `${fileName}`;

                const { data: uploadData, error: uploadError } = await _supabase.storage
                    .from('avatars')
                    .upload(filePath, selectedFile);

                if (uploadError) throw uploadError;

                // Public URL eka ganna
                const { data } = _supabase.storage.from('avatars').getPublicUrl(filePath);
                avatarUrl = data.publicUrl;
            }

            // 2. Profile table eka update kirima
            const username = document.getElementById('u-username').value;
            const phone = document.getElementById('u-phone').value;

            const { error: updateError } = await _supabase.from('profiles').update({
                username, phone, avatar_url: avatarUrl
            }).eq('id', currentUser.id);

            if (updateError) throw updateError;

            alert("Profile updated successfully! ✅");
        } catch (error) {
            alert(error.message);
        } finally {
            saveBtn.disabled = false;
            status.style.display = 'none';
        }
    }

    getProfile();
</script>

</body>
</html>
