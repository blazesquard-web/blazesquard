<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Squad | Join the Team</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #ff0055;
            --secondary: #00f2fe;
            --dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: #fff; padding: 20px;
            overflow-x: hidden;
        }

        /* Moving Background Animation */
        body::before {
            content: ""; position: absolute; width: 300px; height: 300px;
            background: var(--primary); filter: blur(150px);
            top: 10%; left: 10%; z-index: -1; animation: move 10s infinite alternate;
        }

        @keyframes move { from { transform: translate(0,0); } to { transform: translate(100px, 100px); } }

        .reg-card {
            width: 100%; max-width: 500px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            padding: 40px; border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { text-align: center; margin-bottom: 30px; letter-spacing: 2px; font-weight: 600; }
        h2 span { color: var(--secondary); text-shadow: 0 0 10px var(--secondary); }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .input-group { margin-bottom: 18px; }
        
        label { font-size: 11px; color: #aaa; text-transform: uppercase; margin-bottom: 5px; display: block; margin-left: 5px; }

        input {
            width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3); color: #fff; outline: none; transition: 0.3s;
        }

        input:focus {
            border-color: var(--secondary);
            background: rgba(255,255,255,0.05);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        button {
            width: 100%; padding: 15px; margin-top: 15px; border: none; border-radius: 12px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: #fff; font-weight: 600; font-size: 16px; cursor: pointer;
            transition: 0.4s; text-transform: uppercase; letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 0, 85, 0.4);
        }

        button:active { transform: scale(0.98); }

        .footer-text { text-align: center; margin-top: 25px; font-size: 14px; color: #ccc; }
        .footer-text a { color: var(--secondary); text-decoration: none; font-weight: 600; }

        /* Loading Spinner */
        .loader {
            display: none; width: 20px; height: 20px; border: 3px solid #fff;
            border-bottom-color: transparent; border-radius: 50%;
            animation: rotation 1s linear infinite; margin: 0 auto;
        }

        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="reg-card">
        <h2>SQUAD <span>REGISTER</span></h2>
        
        <div class="row">
            <div class="input-group">
                <label>First Name</label>
                <input type="text" id="fname" placeholder="John">
            </div>
            <div class="input-group">
                <label>Last Name</label>
                <input type="text" id="lname" placeholder="Doe">
            </div>
        </div>

        <div class="input-group">
            <label>Username</label>
            <input type="text" id="uname" placeholder="@username_squad">
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="071 234 5678">
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="squadmember@gmail.com">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="pass" placeholder="••••••••">
        </div>

        <button id="reg-btn" onclick="handleRegister()">
            <span id="btn-text">Create Account</span>
            <div class="loader" id="loader"></div>
        </button>

        <p class="footer-text">Already a member? <a href="index.html">Login Now</a></p>
    </div>

    <script>
        // --- Supabase Config (DAPAN UBAGE KEYS) ---
        const SUPABASE_URL = 'https://wyvzozpnzchcbkfbzvkc.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_nbjpXj0bvxHWMJaeCmPzZg_uPsPd4h1';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleRegister() {
            const btn = document.getElementById('reg-btn');
            const btnText = document.getElementById('btn-text');
            const loader = document.getElementById('loader');

            // Input Data ganna
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;
            const fname = document.getElementById('fname').value;
            const lname = document.getElementById('lname').value;
            const uname = document.getElementById('uname').value;
            const phone = document.getElementById('phone').value;

            // Simple Validation
            if(!email || !password || !fname || !uname || !phone) {
                alert("Adoh, okkoma fields tika purawapan!");
                return;
            }

            // Loading Start
            btnText.style.display = 'none';
            loader.style.display = 'block';
            btn.disabled = true;

            try {
                // 1. REGISTER IN SUPABASE AUTH
                const { data: authData, error: authError } = await _supabase.auth.signUp({
                    email: email,
                    password: password
                });

                if (authError) throw authError;

                if (authData.user) {
                    // 2. GENERATE UNIQUE SQUAD ID (11111111 + count)
                    const { count, error: countError } = await _supabase
                        .from('profiles')
                        .select('*', { count: 'exact', head: true });
                    
                    if (countError) throw countError;
                    const finalSquadID = 11111111 + (count || 0);

                    // 3. SAVE DATA TO DATABASE TABLE (profiles)
                    const { error: dbError } = await _supabase
                        .from('profiles')
                        .insert([{
                            id: authData.user.id,
                            first_name: fname,
                            last_name: lname,
                            username: uname,
                            phone: phone,
                            squad_id: finalSquadID
                        }]);

                    if (dbError) throw dbError;

                    alert("Welcome to the Squad! Ubage ID eka: " + finalSquadID);
                    window.location.href = "dashboard.html"; // Success!
                }

            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                // Loading Stop
                btnText.style.display = 'block';
                loader.style.display = 'none';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
