<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Admin | Edit Members</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00f2fe; --pink: #ff0055; --dark: #0f172a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--dark); color: #fff; padding: 40px 5%; }
        
        .admin-box { 
            background: rgba(255,255,255,0.05); 
            padding: 30px; border-radius: 25px; 
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        h1 { margin-bottom: 30px; font-size: 24px; text-transform: uppercase; text-align: center; }
        h1 span { color: var(--pink); }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { color: var(--primary); font-size: 11px; text-transform: uppercase; }

        /* Input fields in table */
        .edit-input {
            background: rgba(0,0,0,0.3);
            border: 1px solid #444;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            width: 130px;
            font-size: 13px;
            outline: none;
        }
        .edit-input:focus { border-color: var(--primary); }

        select { 
            background: #1e293b; color: #fff; border: 1px solid #444; 
            padding: 6px; border-radius: 6px; outline: none; font-size: 13px;
        }
        
        .update-btn { 
            background: var(--pink); border: none; color: #fff; 
            padding: 8px 15px; border-radius: 8px; cursor: pointer; 
            font-size: 12px; font-weight: 600; transition: 0.3s;
        }
        .update-btn:hover { transform: scale(1.05); box-shadow: 0 0 10px var(--pink); }

        .back-btn { display: inline-block; margin-bottom: 20px; color: #fff; text-decoration: none; opacity: 0.7; font-size: 13px; }
    </style>
</head>
<body>

    <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>

    <div class="admin-box">
        <h1>SQUAD <span>MEMBER EDIT</span></h1>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Squad ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Rank</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="user-list">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wyvzozpnzchcbkfbzvkc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_nbjpXj0bvxHWMJaeCmPzZg_uPsPd4h1';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadUsers() {
            const { data: profiles, error } = await _supabase
                .from('profiles')
                .select('*')
                .order('squad_id', { ascending: true });

            if (error) return console.log(error);

            const tbody = document.getElementById('user-list');
            tbody.innerHTML = "";

            profiles.forEach(user => {
                tbody.innerHTML += `
                    <tr>
                        <td style="color:var(--primary); font-weight:600;">#${user.squad_id}</td>
                        <td><input type="text" class="edit-input" id="fname-${user.id}" value="${user.first_name || ''}"></td>
                        <td><input type="text" class="edit-input" id="lname-${user.id}" value="${user.last_name || ''}"></td>
                        <td>
                            <select id="rank-${user.id}">
                                <option value="Member" ${user.rank === 'Member' ? 'selected' : ''}>Member</option>
                                <option value="Moderator" ${user.rank === 'Moderator' ? 'selected' : ''}>Moderator</option>
                                <option value="VVIP" ${user.rank === 'VVIP' ? 'selected' : ''}>VVIP</option>
                                <option value="Admin" ${user.rank === 'Admin' ? 'selected' : ''}>Admin</option>
                                <option value="Owner" ${user.rank === 'Owner' ? 'selected' : ''}>Owner</option>
                            </select>
                        </td>
                        <td>
                            <button class="update-btn" onclick="saveUserChanges('${user.id}')">Update</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function saveUserChanges(userId) {
            const newFname = document.getElementById(`fname-${userId}`).value;
            const newLname = document.getElementById(`lname-${userId}`).value;
            const newRank = document.getElementById(`rank-${userId}`).value;

            // Database එකේ Update කිරීම
            const { error } = await _supabase
                .from('profiles')
                .update({ 
                    first_name: newFname, 
                    last_name: newLname, 
                    rank: newRank 
                })
                .eq('id', userId);

            if (error) {
                alert("Error: " + error.message);
            } else {
                alert("Member details updated successfully! ✅");
            }
        }

        loadUsers();
    </script>
</body>
</html>
